[package]
name = "lighthouse-scrobbler"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
age = "0.12.1"
anyhow = "1.0.104"
base64 = "0.23.1"
bech32 = "0.12.0"
bip39 = { version = "3.0.0", features = ["zeroize"] }
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.191"
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tiny_http = "0.12.0"
ureq = "3.5.1"
uuid = { version = "1.29.1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zbus = "5"
zeroize = "1.9.1"
zstd = "0.14.3"

[dev-dependencies]
age = "0.12.1"
base64 = "0.23.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
uuid = { version = "1.29.1", features = ["v4"] }
zeroize = "1.9.1"
